<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d15">
  <meta name="description" content="FitLog Pro – Rezepte & Makros, Trainingspläne, Trainingslog und Gewohnheitszähler. Offline, ohne Konto.">
  <title>FitLog Pro</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="9" y1="12" x2="15" y2="12" stroke="currentColor" stroke-width="2"/>
            <circle cx="7" cy="12" r="3" fill="currentColor" stroke="none"/>
            <circle cx="17" cy="12" r="3" fill="currentColor" stroke="none"/>
            <circle cx="7" cy="12" r="1.2" fill="#0b1320" stroke="none"/>
            <circle cx="17" cy="12" r="1.2" fill="#0b1320" stroke="none"/>
          </svg>
        </span>
        <span class="brand-text"><strong>FitLog Pro</strong><small>Training · Ernährung · Zähler</small></span>
      </a>

      <nav class="nav" id="nav" aria-label="Hauptnavigation"></nav>

      <div class="sidebar-foot">
        <div class="side-profile" id="sideProfile"></div>
        <div class="side-meta">
          <span id="sideDate"></span>
          <span class="offline-badge"><i></i> offline &amp; lokal</span>
        </div>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menü öffnen">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h2 class="topbar-title" id="pageTitle">Übersicht</h2>
        <div class="topbar-actions">
          <button class="icon-btn device-view-btn" id="deviceToggle" type="button" title="Ansicht: Automatisch" aria-label="Ansicht wechseln">
            <svg class="ico ico-device-desktop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
            <svg class="ico ico-device-mobile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/></svg>
          </button>
          <button class="btn primary quick-add" id="quickAdd" aria-haspopup="true" aria-expanded="false">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <span>Hinzufügen</span>
          </button>
          <div class="quick-menu" id="quickMenu">
            <button data-action="recipe">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              Neues Rezept
            </button>
            <button data-action="meal">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a9 9 0 0 0-9 9 9 9 0 0 0 18 0 9 9 0 0 0-9-9z"/><path d="M12 7v10M7 12h10"/></svg>
              Mahlzeit erfassen
            </button>
            <button data-action="workout">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5M4 9l-2 2 2 2M20 9l2 2-2 2M9 4l2-2 2 2M9 20l2 2 2-2"/></svg>
              Training eintragen
            </button>
            <button data-action="checkin">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2.5-5C10 9.5 11 11 12 11c0-3-1.5-6 0-9z"/></svg>
              Zähler abhaken
            </button>
          </div>
        </div>
      </header>

      <main class="view" id="view"></main>

      <footer class="app-foot">
        <span>FitLog Pro · alle Daten bleiben auf diesem Gerät</span>
      </footer>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/env.js" onerror="window.__env=window.__env||{}"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/recipes.js"></script>
  <script src="js/nutrition.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/plans.js"></script>
  <script src="js/log.js"></script>
  <script src="js/counters.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
